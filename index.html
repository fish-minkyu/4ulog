<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>새벽 B사이드</title>
        <meta name="claude:viewport-fit-sides" content="cover" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600&display=swap"
        />
        <style>
            /* Layout: phone-first music player — deck art edge to edge and the now-playing card stay pinned at the top, the tape's song list scrolls under them. Single dark look by choice. */
            :root {
                --bench: #000000;
                --panel: #0e0e10;
                --panel-line: #1f1f24;
                --paper: #ecebf0;
                --violet: #b18cff;
                --muted: #8a8892;
                --dim: #6c6a74;
                --rule: #1a1a1f;
                --f-body:
                    "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR",
                    system-ui, sans-serif;
                --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
                --gut-l: max(16px, env(safe-area-inset-left, 0px));
                --gut-r: max(16px, env(safe-area-inset-right, 0px));
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            html {
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
                background: var(--bench);
            }
            body {
                margin: 0;
                color: var(--paper);
                font-family: var(--f-body);
                font-size: 15px;
                background: var(--bench);
                -webkit-font-smoothing: antialiased;
                -webkit-text-size-adjust: 100%;
            }
            body::before {
                content: "";
                position: fixed;
                inset: 0 0 auto;
                height: env(safe-area-inset-top, 0px);
                z-index: 10;
                background: var(--bench);
            }
            .app {
                max-width: 440px;
                margin: 0 auto;
                min-height: 100%;
                display: flex;
                flex-direction: column;
            }
            .pad {
                padding-left: var(--gut-l);
                padding-right: var(--gut-r);
            }

            /* ---- pinned top: deck + now playing ---- */
            .top {
                position: sticky;
                top: env(safe-area-inset-top, 0px);
                z-index: 5;
                background: var(--bench);
                padding-bottom: 12px;
                box-shadow: 0 10px 18px -6px rgba(0, 0, 0, 0.9);
            }
            .stage {
                position: relative;
                width: 100%;
                aspect-ratio: 1536/1024;
                max-width: 100%;
                overflow: hidden;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                background: #000;
                touch-action: manipulation;
            }
            @media (min-width: 480px) {
                .app {
                    padding-top: 16px;
                }
                .stage {
                    border-radius: 14px;
                }
                .top .stage {
                    width: calc(100% - 32px);
                    margin: 0 auto;
                }
            }
            .stage img {
                display: block;
                width: 100%;
                height: 100%;
                max-width: none;
                pointer-events: none;
                -webkit-user-drag: none;
            }
            .layer {
                position: absolute;
                inset: 0;
            }
            canvas.layer {
                width: 100%;
                height: 100%;
                pointer-events: none;
            }
            .reel {
                position: absolute;
                border-radius: 50%;
                overflow: hidden;
                will-change: transform;
                -webkit-mask-image: radial-gradient(
                    circle,
                    #000 88%,
                    transparent 100%
                );
                mask-image: radial-gradient(circle, #000 88%, transparent 100%);
            }
            .reel img {
                position: absolute;
                height: auto;
            }
            .slot {
                background: #080616;
            }
            .btn {
                transition:
                    transform 0.07s ease,
                    filter 0.07s ease;
            }
            .btn.down {
                transform: translateY(1.6%) scale(0.982);
                filter: brightness(0.7);
            }
            .btn::after {
                content: "";
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity 0.07s;
                background: linear-gradient(
                    168deg,
                    rgba(0, 0, 0, 0.5) 0%,
                    rgba(0, 0, 0, 0) 20%
                );
            }
            .btn.down::after {
                opacity: 1;
            }
            .hit {
                position: absolute;
                inset: 0;
                background: transparent;
                border: 0;
                padding: 0;
                margin: 0;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
            }
            .hit:focus-visible {
                outline: none;
                background: rgba(200, 180, 255, 0.2);
            }
            .lamp {
                position: absolute;
                border-radius: 50%;
                pointer-events: none;
                transition: opacity 0.25s;
            }
            .lamp.off {
                background: radial-gradient(
                    circle,
                    rgba(24, 16, 44, 0.85) 0 45%,
                    rgba(24, 16, 44, 0) 70%
                );
                opacity: 1;
            }
            .lamp.glow {
                background: radial-gradient(
                    circle,
                    #fbefff 0 8%,
                    #d9a6ff 18%,
                    rgba(185, 110, 255, 0.6) 30%,
                    rgba(160, 90, 255, 0.18) 50%,
                    rgba(150, 80, 255, 0) 70%
                );
                opacity: 0;
            }
            body.playing .lamp.glow {
                opacity: 1;
                animation: lamp 1.6s ease-in-out infinite;
            }
            @keyframes lamp {
                0%,
                100% {
                    opacity: 1;
                }
                45% {
                    opacity: 0.6;
                }
                55% {
                    opacity: 1;
                    transform: scale(1.08);
                }
            }

            .foot {
                margin: 10px 0 0;
                font-size: 12px;
                color: var(--muted);
                text-align: center;
            }

            .now {
                margin-top: 10px;
                background: var(--panel);
                border: 1px solid var(--panel-line);
                border-radius: 14px;
                padding: 12px 14px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .now-top {
                display: flex;
                align-items: center;
                gap: 8px;
                font-family: var(--f-mono);
                font-size: 11px;
                letter-spacing: 0.14em;
                color: var(--muted);
                text-transform: uppercase;
            }
            .led {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #2a2830;
                transition:
                    background 0.2s,
                    box-shadow 0.2s;
            }
            .led.on {
                background: #f3e2ff;
                box-shadow:
                    0 0 3px 1px #e0b8ff,
                    0 0 9px 3px #b46cff,
                    0 0 18px 6px rgba(150, 80, 255, 0.45);
                animation: twinkle 1.6s ease-in-out infinite;
            }
            @keyframes twinkle {
                0%,
                100% {
                    opacity: 1;
                    box-shadow:
                        0 0 3px 1px #e0b8ff,
                        0 0 9px 3px #b46cff,
                        0 0 18px 6px rgba(150, 80, 255, 0.45);
                }
                45% {
                    opacity: 0.75;
                    box-shadow:
                        0 0 2px 1px #d8a8ff,
                        0 0 6px 2px #a35cf5,
                        0 0 10px 3px rgba(150, 80, 255, 0.25);
                }
                55% {
                    opacity: 1;
                    box-shadow:
                        0 0 4px 2px #f0d4ff,
                        0 0 12px 4px #c07cff,
                        0 0 24px 8px rgba(160, 90, 255, 0.5);
                }
            }
            .now-top .count {
                margin-left: auto;
                font-variant-numeric: tabular-nums;
            }
            .now-title {
                margin: 0;
                font-size: 18px;
                font-weight: 600;
                line-height: 1.3;
                color: var(--paper);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .now-artist {
                margin: 2px 0 0;
                font-size: 13px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-height: 1.2em;
            }
            .bar {
                height: 3px;
                background: #26252b;
                border-radius: 2px;
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                width: 0;
                background: var(--violet);
            }
            .times {
                display: flex;
                justify-content: space-between;
                font-family: var(--f-mono);
                font-size: 11.5px;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }

            /* ---- song list ---- */
            .list {
                padding-top: 6px;
                padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            }
            .list-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                padding: 10px 2px 8px;
                border-bottom: 1px solid #26252b;
            }
            .list-head h2 {
                margin: 0;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.12em;
                color: var(--paper);
            }
            .list-head h2 b {
                font-size: 17px;
                margin-right: 2px;
            }
            .list-head .meta {
                font-family: var(--f-mono);
                font-size: 11px;
                color: var(--muted);
            }
            ol.tracks {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            .tracks li {
                border-bottom: 1px solid var(--rule);
            }
            .tracks li:last-child {
                border-bottom: 0;
            }
            .track {
                width: 100%;
                min-height: 56px;
                display: grid;
                grid-template-columns: 30px 1fr auto;
                align-items: center;
                gap: 10px;
                background: none;
                border: 0;
                padding: 8px 2px;
                color: inherit;
                text-align: left;
                cursor: pointer;
                font: inherit;
                -webkit-tap-highlight-color: transparent;
                border-radius: 8px;
            }
            .track:active {
                background: #121216;
            }
            .track:focus-visible {
                outline: 2px solid var(--violet);
                outline-offset: -2px;
            }
            .track .no {
                font-family: var(--f-mono);
                font-size: 12px;
                color: var(--dim);
                display: flex;
                align-items: center;
            }
            .track .name {
                font-family: var(--f-body);
                font-size: 16px;
                font-weight: 400;
                line-height: 1.35;
                min-width: 0;
                overflow-wrap: anywhere;
                color: var(--paper);
            }
            .track .len {
                font-family: var(--f-mono);
                font-size: 12px;
                color: var(--dim);
                font-variant-numeric: tabular-nums;
            }
            .track .name .t {
                display: block;
            }
            .track .name .ar {
                display: block;
                font-size: 12.5px;
                color: var(--dim);
                margin-top: 1px;
            }
            .track[aria-current="true"] .name .t {
                color: var(--violet);
                font-weight: 600;
            }
            .eq {
                display: none;
                gap: 2px;
                align-items: flex-end;
                height: 12px;
                width: 14px;
            }
            .eq i {
                display: block;
                width: 3px;
                background: var(--violet);
                height: 40%;
            }
            .track[aria-current="true"] .eq {
                display: inline-flex;
            }
            .track[aria-current="true"] .num {
                display: none;
            }
            body.playing .eq i {
                animation: eq 0.9s ease-in-out infinite;
            }
            .eq i:nth-child(2) {
                animation-delay: -0.3s !important;
            }
            .eq i:nth-child(3) {
                animation-delay: -0.6s !important;
            }
            @keyframes eq {
                0%,
                100% {
                    height: 30%;
                }
                50% {
                    height: 100%;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                body.playing .eq i,
                body.playing .lamp.glow,
                .led.on {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="app">
            <div class="top">
                <div class="stage" id="stage">
                    <img
                        id="base"
                        alt="보라색 B사이드 60분 카세트가 꽂힌 카세트 덱 그림. 아래에 되감기, 재생, 정지, 빨리 감기 버튼이 있다"
                    />
                </div>
                <div class="pad">
                    <p class="foot">
                        ◀◀ 이전 곡 · ▶ 재생 · ■ 정지 · ▶▶ 다음 곡
                    </p>
                    <section class="now" aria-live="polite">
                        <div class="now-top">
                            <span class="led" id="led"></span
                            ><span id="state">Stop</span
                            ><span class="count" id="count">01 / 06</span>
                        </div>
                        <div>
                            <h1 class="now-title" id="title"></h1>
                            <p class="now-artist" id="artist"></p>
                        </div>
                        <div class="bar"><i id="prog"></i></div>
                        <div class="times">
                            <span id="cur">0:00</span><span id="dur">0:00</span>
                        </div>
                    </section>
                </div>
            </div>

            <section class="list pad" aria-label="테이프 수록곡">
                <div class="list-head">
                    <h2><b>B</b> SIDE</h2>
                    <span class="meta" id="meta"></span>
                </div>
                <ol class="tracks" id="list"></ol>
            </section>
        </main>

                        s.buffer = noise;
                        const fl = ctx.createBiquadFilter();
                        fl.type = type;
                        fl.frequency.value = f;
                        const g = ctx.createGain();
                        g.gain.setValueAtTime(v, t);
                        g.gain.exponentialRampToValueAtTime(0.001, t + d);
                        s.connect(fl);
                        fl.connect(g);
                        g.connect(bus);
                        s.start(t, Math.random());
                        s.stop(t + d + 0.02);
                    };
                    function sched(st, t) {
                        const bar = Math.floor(st / 8),
                            e = st % 8,
                            ch = tr.prog[bar % 4];
                        const outro = bar >= tr.bars - 2,
                            intro = bar < 2;
                        if (e === 0) {
                            ch.forEach((m) => {
                                tone(m, t, E * 7.9, "triangle", 0.042);
                                tone(m + 12, t, E * 7.2, "sine", 0.016);
                            });
                            tone(ch[0] - 12, t, E * 3, "sine", 0.22);
                        }
                        if (e === 5 && !outro)
                            tone(ch[0] - 12, t, E * 2.5, "sine", 0.15);
                        if (!intro && !outro) {
                            if (tr.kick.includes(e)) kick(t);
                            if (tr.snare.includes(e))
                                nz(t, "bandpass", 1800, 0.18, 0.12);
                            nz(
                                t + (e % 2 ? E * 0.12 : 0),
                                "highpass",
                                7000,
                                e % 2 ? tr.hat : tr.hat * 0.6,
                                0.05,
                            );
                            const n = tr.mel[bar % 8][e];
                            if (n && bar >= 4) {
                                tone(
                                    n,
                                    t,
                                    E * 1.8,
                                    tr.lead,
                                    tr.lead === "square" ? 0.022 : 0.05,
                                );
                                tone(n, t, E * 1.8, "sine", 0.045);
                            }
                        }
                    }
                    hissG.gain.setTargetAtTime(0.012, ctx.currentTime, 0.1);
                    if (tr.rain)
                        rainG.gain.setTargetAtTime(0.05, ctx.currentTime, 0.4);
                    timer = setInterval(() => {
                        while (!done && nextT < ctx.currentTime + 0.15) {
                            if (step >= total) {
                                done = true;
                                break;
                            }
                            sched(step, nextT);
                            nextT += E;
                            step++;
                        }
                        if (done && ctx.currentTime >= nextT + E * 2) {
                            clearInterval(timer);
                            api.onend && api.onend();
                        }
                    }, 25);
                    const api = {
                        elapsed: () =>
                            Math.max(0, Math.min(tr.dur, ctx.currentTime - t0)),
                        stop() {
                            clearInterval(timer);
                            bus.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
                            setTimeout(() => bus.disconnect(), 400);
                            hissG.gain.setTargetAtTime(
                                0,
                                ctx.currentTime,
                                0.08,
                            );
                            rainG.gain.setTargetAtTime(
                                0,
                                ctx.currentTime,
                                0.15,
                            );
                        },
                    };
                    return api;
                }
                /* 실제 노래 재생: 하나의 audio 요소를 계속 재사용해야 휴대폰에서도 자동으로 다음 곡이 이어짐 */
                const audioEl = new Audio();
                audioEl.preload = "auto";
                audioEl.setAttribute("playsinline", "");
                const urlCache = {};
                let selfPause = false;
                function songURL(tr) {
                    if (tr.src) return tr.src;
                    if (urlCache[tr.data]) return urlCache[tr.data];
                    const bin = atob(
                        document.getElementById(tr.data).textContent.trim(),
                    );
                    const u8 = new Uint8Array(bin.length);
                    for (let i = 0; i < bin.length; i++)
                        u8[i] = bin.charCodeAt(i);
                    return (urlCache[tr.data] = URL.createObjectURL(
                        new Blob([u8], { type: "audio/mp4" }),
                    ));
                }
                function FilePlayer(tr, offset) {
                    const a = audioEl,
                        url = songURL(tr);
                    let alive = true;
                    const onEnd = () => {
                        if (!alive) return;
                        alive = false;
                        cleanup();
                        api.onend && api.onend();
                    };
                    const onMeta = () => {
                        if (offset > 0)
                            try {
                                a.currentTime = offset;
                            } catch (_) {}
                    };
                    function cleanup() {
                        a.removeEventListener("ended", onEnd);
                        a.removeEventListener("loadedmetadata", onMeta);
                    }
                    a.addEventListener("ended", onEnd);
                    if (a.src !== url) {
                        a.src = url;
                        a.addEventListener("loadedmetadata", onMeta, {
                            once: true,
                        });
                    } else {
                        try {
                            a.currentTime = offset;
                        } catch (_) {}
                    }
                    a.play().catch(() => {});
                    if (ctx)
                        hissG.gain.setTargetAtTime(0.006, ctx.currentTime, 0.2);
                    const api = {
                        file: true,
                        elapsed: () =>
                            a.currentTime > 0 || !offset
                                ? a.currentTime
                                : offset,
                        stop() {
                            alive = false;
                            cleanup();
                            if (!a.paused) {
                                selfPause = true;
                                a.pause();
                            }
                            if (ctx)
                                hissG.gain.setTargetAtTime(
                                    0,
                                    ctx.currentTime,
                                    0.08,
                                );
                        },
                    };
                    return api;
                }
                // 잠금화면·이어폰 등 바깥에서 멈췄을 때 데크도 같이 멈춤
                audioEl.addEventListener("pause", () => {
                    if (selfPause) {
                        selfPause = false;
                        return;
                    }
                    if (engine && engine.file && !audioEl.ended) stop();
                });

                /* ---------- 데크 상태 ---------- */
                const LAST = TRACKS.length - 1;
                let idx = 0,
                    offset = 0,
                    playing = false,
                    engine = null;
                let wind = 0; // -1 되감는 중, +1 감는 중, 0 정지
                let resumeT = null;
                const fmt = (s) => {
                    s = Math.max(0, Math.round(s || 0));
                    return (
                        Math.floor(s / 60) +
                        ":" +
                        String(s % 60).padStart(2, "0")
                    );
                };
                const atTapeEnd = () =>
                    idx === LAST && offset >= TRACKS[LAST].dur - 0.05;

                const list = $("list");
                function renderList() {
                    list.innerHTML = "";
                    TRACKS.forEach((t, i) => {
                        const li = document.createElement("li");
                        const b = document.createElement("button");
                        b.type = "button";
                        b.className = "track";
                        b.innerHTML = `<span class="no"><span class="num">${String(i + 1).padStart(2, "0")}</span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="name"><span class="t"></span><span class="ar"></span></span><span class="len">${t.dur ? fmt(t.dur) : "--:--"}</span>`;
                        b.querySelector(".t").textContent = t.title;
                        b.querySelector(".ar").textContent = t.artist || "";
                        b.addEventListener("click", () => {
                            clack();
                            selectAndPlay(i);
                        });
                        li.appendChild(b);
                        list.appendChild(li);
                    });
                    const tot = TRACKS.reduce((a, t) => a + (t.dur || 0), 0);
                    $("meta").textContent =
                        `${TRACKS.length} SONGS · ${fmt(tot)}`;
                    renderNow();
                }
                function renderNow() {
                    const t = TRACKS[idx];
                    $("title").textContent = t.title;
                    $("artist").textContent = t.artist || "";
                    if ("mediaSession" in navigator && window.MediaMetadata) {
                        try {
                            navigator.mediaSession.metadata = new MediaMetadata(
                                {
                                    title: t.title,
                                    artist: t.artist || "",
                                    album: "B SIDE",
                                },
                            );
                        } catch (_) {}
                    }
                    $("count").textContent =
                        String(idx + 1).padStart(2, "0") +
                        " / " +
                        String(TRACKS.length).padStart(2, "0");
                    $("dur").textContent = t.dur ? fmt(t.dur) : "--:--";
                    list.querySelectorAll(".track").forEach((b, i) =>
                        b.setAttribute(
                            "aria-current",
                            i === idx ? "true" : "false",
                        ),
                    );
                }
                function setLabel(txt) {
                    $("state").textContent =
                        txt ||
                        (wind < 0
                            ? "Rewind"
                            : wind > 0
                              ? "Fast Fwd"
                              : playing
                                ? "Play"
                                : "Stop");
                    const on = playing && !wind;
                    $("led").classList.toggle("on", on);
                    document.body.classList.toggle("playing", on);
                }
                function latchPlay(on) {
                    PLAY.el.classList.toggle("down", on);
                    PLAY.hit.setAttribute("aria-pressed", String(on));
                }

                function startEngine() {
                    const tr = TRACKS[idx];
                    engine =
                        tr.src || tr.data
                            ? FilePlayer(tr, offset)
                            : Synth(tr, offset);
                    engine.onend = () => {
                        engine = null;
                        if (idx === LAST) {
                            offset = TRACKS[LAST].dur;
                            tapeEnd();
                        } else {
                            idx++;
                            offset = 0;
                            renderNow();
                            startEngine();
                        }
                    };
                }
                function haltEngine() {
                    if (engine) {
                        offset = engine.elapsed();
                        engine.onend = null;
                        engine.stop();
                        engine = null;
                    }
                }

                /* 버튼 눌림: 짧게 탭해도 눈에 보이도록 최소 0.18초는 내려가 있음 */
                function tapPress(B) {
                    const t0 = performance.now();
                    B.el.classList.add("down");
                    const up = () => {
                        setTimeout(
                            () => {
                                if (B !== windBtn && !(B === PLAY && playing))
                                    B.el.classList.remove("down");
                            },
                            Math.max(0, 180 - (performance.now() - t0)),
                        );
                        B.hit.removeEventListener("pointerup", up);
                        B.hit.removeEventListener("pointercancel", up);
                    };
                    B.hit.addEventListener("pointerup", up);
                    B.hit.addEventListener("pointercancel", up);
                }

                // 테이프 끝(또는 처음)에 닿음: '툭' 하고 눌려 있던 버튼이 튀어오르며 멈춤
                function tapeEnd() {
                    clearTimeout(resumeT);
                    haltEngine();
                    unlatchWind();
                    thunk();
                    playing = false;
                    latchPlay(false);
                    setLabel(
                        idx === 0 && offset === 0 ? "Tape start" : "Tape end",
                    );
                }

                function play() {
                    initAudio();
                    if (wind) unlatchWind(); // 감던 버튼이 풀리고 재생으로
                    if (playing) return;
                    if (atTapeEnd()) {
                        latchPlay(true);
                        setTimeout(() => {
                            latchPlay(false);
                            thunk();
                            setLabel("Tape end");
                        }, 110);
                        return;
                    }
                    playing = true;
                    latchPlay(true);
                    startEngine();
                    setLabel();
                }
                function stop() {
                    clearTimeout(resumeT);
                    unlatchWind();
                    haltEngine();
                    playing = false;
                    latchPlay(false);
                    setLabel();
                }
                function selectAndPlay(i) {
                    initAudio();
                    clearTimeout(resumeT);
                    unlatchWind();
                    haltEngine();
                    const dir = i >= idx ? 1 : -1;
                    idx = i;
                    offset = 0;
                    renderNow();
                    playing = true;
                    latchPlay(true);
                    setLabel();
                    spin = 7 * dir;
                    whirStart();
                    setTimeout(whirStop, 350);
                    resumeT = setTimeout(() => {
                        if (playing && !engine) startEngine();
                    }, 350);
                }

                /* 감기: ◀◀ / ▶▶ 를 누르면 버튼이 내려간 채 걸리고,
     ■ 정지나 ▶ 재생을 누를 때까지(또는 테이프 끝까지) 계속 곡을 넘김 */
                const FIRST_MS = 380,
                    STEP_MS = 650;
                let windTimer = null,
                    windSteps = 0,
                    windBtn = null;
                function windStep() {
                    if (wind > 0) {
                        if (idx === LAST) {
                            offset = TRACKS[LAST].dur;
                            tapeEnd();
                            return false;
                        }
                        idx++;
                        offset = 0;
                    } else {
                        if (windSteps === 0 && offset > 3) {
                            offset = 0;
                        } // 곡 중간이면 먼저 이 곡 처음으로
                        else if (idx === 0) {
                            offset = 0;
                            tapeEnd();
                            return false;
                        } else {
                            idx--;
                            offset = 0;
                        }
                    }
                    windSteps++;
                    renderNow();
                    return true;
                }
                function latchWind(dir, B) {
                    initAudio();
                    clack();
                    if (wind === dir) return;
                    unlatchWind();
                    clearTimeout(resumeT);
                    if (playing) {
                        haltEngine();
                        playing = false;
                        latchPlay(false);
                    } // 감기를 누르면 재생 버튼은 튀어오름
                    if (dir > 0 && atTapeEnd()) {
                        B.el.classList.add("down");
                        setTimeout(() => {
                            B.el.classList.remove("down");
                            thunk();
                        }, 110);
                        return;
                    }
                    wind = dir;
                    windBtn = B;
                    windSteps = 0;
                    B.el.classList.add("down");
                    whirStart();
                    setLabel();
                    const tick = () => {
                        if (windStep()) windTimer = setTimeout(tick, STEP_MS);
                    };
                    windTimer = setTimeout(tick, FIRST_MS);
                }
                function unlatchWind() {
                    if (!wind) return;
                    clearTimeout(windTimer);
                    windTimer = null;
                    if (windBtn) windBtn.el.classList.remove("down");
                    windBtn = null;
                    wind = 0;
                    whirStop();
                    setLabel();
                }

                function bindPress(B, fn) {
                    B.hit.addEventListener("pointerdown", (e) => {
                        e.preventDefault();
                        tapPress(B);
                        fn();
                    });
                    B.hit.addEventListener("keydown", (e) => {
                        if ((e.key === "Enter" || e.key === " ") && !e.repeat) {
                            e.preventDefault();
                            B.el.classList.add("down");
                            setTimeout(() => {
                                if (B !== windBtn && !(B === PLAY && playing))
                                    B.el.classList.remove("down");
                            }, 180);
                            fn();
                        }
                    });
                }
                bindPress(REW, () => latchWind(-1, REW));
                bindPress(FF, () => latchWind(1, FF));
                bindPress(PLAY, () => {
                    clack();
                    play();
                });
                bindPress(STOP, () => {
                    clack();
                    stop();
                });

                document.addEventListener("keydown", (e) => {
                    if (e.target.closest && e.target.closest("button")) return;
                    if (e.repeat) return;
                    if (e.code === "Space") {
                        e.preventDefault();
                        clack();
                        playing || wind ? stop() : play();
                    }
                    if (e.code === "ArrowLeft") latchWind(-1, REW);
                    if (e.code === "ArrowRight") latchWind(1, FF);
                });

                /* ---------- 애니메이션 ---------- */
                let spin = 0,
                    speed = 0,
                    angL = 0,
                    angR = 0,
                    last = performance.now();
                function frame(now) {
                    const dt = Math.min(0.05, (now - last) / 1000);
                    last = now;
                    spin *= Math.pow(0.02, dt);
                    const target = wind
                        ? wind * 7
                        : Math.abs(spin) > 0.3
                          ? spin
                          : playing && engine
                            ? 1
                            : 0;
                    speed +=
                        (target - speed) * Math.min(1, dt * (wind ? 9 : 6));
                    angL += speed * dt * 95;
                    angR += speed * dt * 140;
                    reelL.style.transform = "rotate(" + angL + "deg)";
                    reelR.style.transform = "rotate(" + angR + "deg)";
                    drawTape(angL);
                    const t = TRACKS[idx],
                        el = engine ? engine.elapsed() : offset;
                    $("cur").textContent = fmt(el);
                    $("prog").style.width =
                        (t.dur ? Math.min(100, (el / t.dur) * 100) : 0) + "%";
                    requestAnimationFrame(frame);
                }
                if ("mediaSession" in navigator) {
                    const ms = navigator.mediaSession,
                        h = (k, f) => {
                            try {
                                ms.setActionHandler(k, f);
                            } catch (_) {}
                        };
                    h("play", () => play());
                    h("pause", () => stop());
                    h("stop", () => stop());
                    h("previoustrack", () => {
                        if (idx > 0) selectAndPlay(idx - 1);
                    });
                    h("nexttrack", () => {
                        if (idx < LAST) selectAndPlay(idx + 1);
                    });
                }
                renderList();
                setLabel();
                requestAnimationFrame(frame);
            })();
        </script>
    </body>
</html>
