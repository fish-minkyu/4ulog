<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사유록 명륜당 나들이</title>
<style>
/* 종이 한 장씩 세로로 넘겨 보는 초대장 */
:root{--paper:#f6e4c6;--paper-deep:#ecd5b0;--ink:#4a4436;color-scheme:light}
body{background:var(--paper);color:var(--ink);background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 40%),radial-gradient(circle at 80% 90%,rgba(160,120,70,.08),transparent 45%)}
body{margin:0;font-family:system-ui,sans-serif}
img{max-width:100%}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vw,40px);padding-block:clamp(16px,4vw,48px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{margin:0;width:100%;max-width:540px;box-shadow:0 1px 2px rgba(74,68,54,.10),0 10px 30px -12px rgba(74,68,54,.25);background:var(--paper-deep)}
.sheet img{display:block;width:100%;height:auto;max-width:100%}
@media (max-width:600px){main{gap:16px}}
.bgm{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);font:600 14px/1 system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 18px -8px rgba(74,68,54,.45)}
.bgm:focus-visible{outline:3px solid #e2a63b;outline-offset:2px}
.bgm .ic{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px}
.bgm.on .ic{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bgm.on .ic{animation:none}}
</style>
</head>
<body>
<main>
<figure class="sheet"><img src="assets/page1.webp" alt="사유록 초대장 — 2026년 11월 7일 14시 30분, 서울 명륜당" width="941" height="1672"></figure>
<figure class="sheet"><img src="assets/page2.webp" alt="나들이 지도 — 효자로부터 성균관 명륜당까지 10곳" width="941" height="1672" loading="lazy"></figure>
<figure class="sheet"><img src="assets/page3.webp" alt="이런 걸 남겨요 — 예시 작례" width="1024" height="1536" loading="lazy"></figure>
<figure class="sheet"><img src="assets/page4.webp" alt="나랑 놀자 — 성균관 명륜당에서 첫 일정을 시작하고, 이후 코스는 유동적으로 바뀝니다. 중도 참여, 늦은 참여 가능" width="1024" height="1536" loading="lazy"></figure>
</main>
<audio id="bgm-audio" loop preload="auto" src="assets/song.m4a"></audio>
<button class="bgm" id="bgm-btn" type="button" aria-pressed="false"><span class="ic" aria-hidden="true">▶</span><span class="lb">음악 켜기</span></button>
<script>
(function(){var a=document.getElementById('bgm-audio'),b=document.getElementById('bgm-btn'),ic=b.querySelector('.ic'),lb=b.querySelector('.lb');
function set(on){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);ic.textContent=on?'♪':'▶';lb.textContent=on?'음악 끄기':'음악 켜기';}
b.addEventListener('click',function(){if(a.paused){a.play().then(function(){set(true)}).catch(function(){set(false)});}else{a.pause();set(false);}});
a.addEventListener('pause',function(){set(false)});a.addEventListener('play',function(){set(true)});})();
</script>
</body>
</html>
