<style>
  html, body { margin: 0; height: 100%; background: #07080d; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }

<body>
<canvas id="screen" aria-label="밤하늘에 터지는 아스키 아트 불꽃놀이"></canvas>

<script>
"use strict";
// ── 0. 기본 설정 ─────────────────────────────────────────────
const W = 110, H = 50, N = W * H, FPS = 30, DT = 1 / FPS;
const RAMP = ".:-=+*f%#0@";
const CELL = 1 / 1.72;                 // 글자 한 칸의 가로:세로
const DECK = 41;                       // 다리 상판이 놓이는 줄
const GROUND = DECK;                   // 폭죽이 올라가기 시작하는 줄
const DECAY = 0.85;                    // 잔상이 남는 정도
const TAU = Math.PI * 2;

// 시간표 (초)
const T_OPEN = [0.2, 1.8];             // 1막 — 여러 발
const T_ROW = 2.3;                     // 일렬 6발 발사 → 0.5초 뒤 위쪽에서 5발
const T_BIG = 4.7;                     // 2막 — 가운데 주황색 큰 폭죽 한 발
const T_FINALE = [7.8, 10.9];          // 3막 — 더 많이
const T_HNY = 12.2;                    // 4막 — HAPPY NEW YEAR
const T_HNY_END = 14.2;
const T_TEXT = 14.2;                   // 5막 — 밤하늘에 思惟錄
const T_TEXT_END = 18.5;               // 글자가 불티로 흩어지는 시각
const T_LOOP = 20.0;                   // 한 바퀴 = 20초

// 일반 폭죽 색 (주황은 큰 폭죽 전용이라 뺀다)
const PALETTE = [[255, 70, 80], [255, 215, 90], [90, 235, 120], [80, 220, 255],
                 [95, 130, 255], [185, 110, 255], [255, 120, 200], [235, 240, 255]];
const ORANGE = [255, 140, 30];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry32(2026);
const uni = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const code = s => s.charCodeAt(0);

// ── 1. 발사 시간표 만들기 ────────────────────────────────────
// 퍼지는 모양 12가지 — 골고루 섞이도록 카드 더미처럼 뽑는다
// 날아가다 다시 갈라지는 종류(crossette · fork · multi)를 절반 가까이 넣었다
const TYPES = ["crossette", "fork", "multi", "peony", "chrys", "crossette", "fork", "multi", "ring", "ball",
               "crossette", "fork", "multi", "willow", "crackle", "double", "saturn", "palm", "fork", "chrys"];
let deck = [];
function nextType() {
  if (!deck.length) {
    deck = TYPES.slice();
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  }
  return deck.pop();
}
const SHOWS = [];
function schedule([from, to], count) {
  for (let i = 0; i < count; i++) {
    SHOWS.push({
      t: from + (to - from) * (i + rnd()) / count,
      x: uni(W * .07, W * .93), y: uni(5, 23), rise: uni(.8, 1.2),
      color: pick(PALETTE), color2: pick(PALETTE),
      speed: uni(13, 20), life: uni(1.3, 2.0), type: nextType(),
    });
  }
}
schedule(T_OPEN, 9);
{ // 일렬로 6발이 함께 올라와 터지고, 0.5초 뒤 더 위에서 5발이 올라오는 모습 없이 파바방
  const SNOW = [245, 248, 255], LEMON = [255, 240, 110], RISE = 1.05;
  for (let i = 0; i < 6; i++)
    SHOWS.push({ t: T_ROW, x: W * (.11 + .156 * i), y: 22, rise: RISE, type: "peony",
                 color: i % 2 ? LEMON : SNOW, color2: SNOW, speed: 15, life: 1.7 });
  for (let i = 0; i < 5; i++)
    SHOWS.push({ t: T_ROW + RISE + .5 + .09 * i, x: W * (.188 + .156 * i), y: 9, instant: true, type: "chrys",
                 color: i % 2 ? SNOW : LEMON, color2: i % 2 ? SNOW : LEMON, speed: 16.5, life: 1.6 });
}
schedule(T_FINALE, 26);
SHOWS.push({ t: T_BIG, x: W / 2, y: 19, rise: 1.3, big: true });
// ── 思惟錄 글자 ──────────────────────────────────────────────
const GLYPH = [   // 思惟錄 — 글자를 격자에 맞춰 미리 그려 둔 것 (# 진하게, + 연하게)
  "   ##########################            ###+        ###     ###+             ####        ###            ",
  "   ##########################            ###+       ####     ###+            #######     +###++++++##+   ",
  "   ####       +###        ###            ###+      +###     ####            ###+ ####+   #############   ",
  "   ####       +###        ###            ######    ####    ####            ###+   +####  ###      ####   ",
  "   ##########################         ## ###+###  ###################    ####+      ##  +###      ###+   ",
  "   ##########################        +## ###+ ##+###################+   #############   #############    ",
  "   ####       +###       +###        ### ###+ ########     ###           ++##########   ###++++++####    ",
  "   ####       +###        ###        ### ###+  #######     ###                ###                +###    ",
  "   ####       +###       +###        ##+ ###+ +#####################          ###     ###################",
  "   ##########################       ###  ###+     ##################     ###############################+",
  "   +#########################            ###+     ####     ###           #############  +    +###    ++  ",
  "             ###+                        ###+     ####     ###                ###      ###+  +###+  +### ",
  "             ######        +             ###+     #################+      ##+ ###  ###  ###+ +#### +###  ",
  "   #### +###   +#####    ####            ###+     ##################      ### ###  ##    ### +########   ",
  "   ###+ +###     +###+    ####           ###+     ####+++++###+++++       +## ### ###       ++######     ",
  "  ####  +###       +   #+  ####          ###+     ####     ###             ## ### +#     +###########    ",
  " +###   +###          +###  ####         ###+     ####     ###                ########+#####++### +####  ",
  "+####   +###          ###+   ####        ###+     ###################    #################   +###   #####",
  "+###     ################    ###+        ###+     ###################    ########+    #+   ######    +## ",
  "          ##############                 ###+     ####                    +                #####         ",
];
const TEXT_X = Math.floor((W - GLYPH[0].length) / 2), TEXT_Y = 3, CHAR_W = 33, CHAR_GAP = 3;
const TEXT_RISE = 1.0, textCells = [];
for (let k = 0; k < 3; k++) {                           // 글자마다 한 발씩 올라와 터지며 글자가 번져 나온다
  const cx = TEXT_X + k * (CHAR_W + CHAR_GAP) + CHAR_W / 2, cy = TEXT_Y + GLYPH.length / 2;
  SHOWS.push({ t: T_TEXT + .12 * k, x: cx, y: cy, rise: TEXT_RISE, type: "ball", color: [255, 240, 170], color2: [255, 240, 170], speed: 10, life: 1 });
  for (let r = 0; r < GLYPH.length; r++) for (let c = 0; c < CHAR_W; c++) {
    const g = GLYPH[r][k * (CHAR_W + CHAR_GAP) + c];
    if (g === " ") continue;
    const x = TEXT_X + k * (CHAR_W + CHAR_GAP) + c, y = TEXT_Y + r;
    textCells.push({ x, y, w: g === "#" ? 1 : .5, ph: uni(0, TAU), end: T_TEXT_END, col: [255, 236, 150],
                     at: T_TEXT + .12 * k + TEXT_RISE + Math.hypot((x - cx) * CELL, y - cy) / 13 + uni(0, .2) });
  }
}
// ── HAPPY NEW YEAR 글자 (5×7 점 글꼴, 가로는 두 칸씩) ─────────
const FONT5 = {
  H: ["10001", "10001", "10001", "11111", "10001", "10001", "10001"],
  A: ["01110", "10001", "10001", "11111", "10001", "10001", "10001"],
  P: ["11110", "10001", "10001", "11110", "10000", "10000", "10000"],
  Y: ["10001", "10001", "01010", "00100", "00100", "00100", "00100"],
  N: ["10001", "11001", "10101", "10011", "10001", "10001", "10001"],
  E: ["11111", "10000", "10000", "11110", "10000", "10000", "11111"],
  W: ["10001", "10001", "10001", "10101", "10101", "11011", "10001"],
  R: ["11110", "10001", "10001", "11110", "10100", "10010", "10001"],
};
{
  const LETTER = 10, GAP = 2, SPACE = 6;
  const COLORS = [[255, 240, 110], [255, 120, 200], [80, 220, 255], [90, 235, 120], [255, 215, 90], [185, 130, 255], [255, 110, 110]];
  let n = 0;
  [["HAPPY", 5], ["NEW YEAR", 14]].forEach(([line, top]) => {
    let width = 0;
    for (const c of line) width += c === " " ? SPACE - GAP : LETTER + GAP;
    let x0 = Math.round((W - (width - GAP)) / 2);
    for (const c of line) {
      if (c === " ") { x0 += SPACE - GAP; continue; }
      const at = T_HNY + .075 * n, col = COLORS[n % COLORS.length];    // 한 글자씩 파바박 켜진다
      FONT5[c].forEach((row, r) => { for (let k = 0; k < 5; k++) if (row[k] === "1") for (let d = 0; d < 2; d++)
        textCells.push({ x: x0 + k * 2 + d, y: top + r, w: 1, ph: uni(0, TAU), at: at + uni(0, .06), end: T_HNY_END + .03 * n, col }); });
      x0 += LETTER + GAP; n++;
    }
  });
}
SHOWS.sort((a, b) => a.t - b.t);

// ── 2. 배경 — 별 · 현수교 · 강물 ─────────────────────────────
const cityCh = new Uint16Array(N), cityRgb = new Float32Array(N * 3);   // 다리 그림
const stars = Array.from({ length: 80 }, () => ({
  i: Math.floor(rnd() * 26) * W + Math.floor(rnd() * W),
  br: uni(.25, .8), w: uni(.6, 3), ph: uni(0, TAU), ch: code(pick([".", ".", "·", "*"])) }));
const TOWERS = [27, 82], TOP = 27;                      // 주탑 위치와 꼭대기 줄
const STEEL = [205, 78, 48], CABLE = [165, 62, 44], WIRE = [84, 38, 34];
function put(x, y, c, col) {
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  const i = y * W + x; cityCh[i] = code(c);
  cityRgb[i * 3] = col[0]; cityRgb[i * 3 + 1] = col[1]; cityRgb[i * 3 + 2] = col[2];
}
function cableY(x) {                                    // 케이블 높이 (줄 단위, 소수)
  const [a, b] = TOWERS;
  if (x < a) return DECK - 1 - (DECK - 1 - TOP) * x / a;                 // 왼쪽 측경간
  if (x > b) return DECK - 1 - (DECK - 1 - TOP) * (W - 1 - x) / (W - 1 - b);
  const u = (x - a) / (b - a);
  return TOP + (DECK - 2 - TOP) * 4 * u * (1 - u);                       // 가운데는 아래로 처진다
}
for (let x = 0; x < W; x++) {
  const y = cableY(x), yr = Math.round(y), slope = cableY(x + 1) - cableY(x - 1);
  if (x % 3 === 1) for (let r = yr + 1; r < DECK; r++) put(x, r, "|", WIRE);      // 행어 로프
  put(x, yr, slope > .5 ? "\\" : slope < -.5 ? "/" : y - Math.floor(y) < .5 ? "'" : ".", CABLE);
}
for (let x = 0; x < W; x++) {                           // 상판과 트러스
  put(x, DECK, "=", STEEL);
  put(x, DECK + 1, x % 2 ? "/" : "\\", WIRE);
}
for (const tx of TOWERS) {                              // 주탑
  for (let r = TOP - 1; r <= DECK + 4; r++) {
    const bar = (r - TOP) % 4 === 0 && r < DECK;
    put(tx - 1, r, "|", STEEL); put(tx + 1, r, "|", STEEL);
    put(tx, r, bar ? "=" : r > DECK ? "#" : " ", bar ? STEEL : CABLE);
  }
  put(tx - 1, TOP - 2, "_", STEEL); put(tx, TOP - 2, "_", STEEL); put(tx + 1, TOP - 2, "_", STEEL);
}
const lamps = []; for (let x = 3; x < W; x += 6) lamps.push(x);          // 가로등
const cars = Array.from({ length: 7 }, () => ({ x: uni(0, W), v: pick([-1, 1]) * uni(5, 9) }));

// ── 3. 불꽃 시뮬레이션 ───────────────────────────────────────
const glow = new Float32Array(N * 3);                   // 잔상이 쌓이는 버퍼
let rockets = [], parts = [], next = 0, simT = 0;

function deposit(x, y, r, g, b, k) {
  const cx = Math.round(x), cy = Math.round(y);
  if (cx < 0 || cx >= W || cy < 0 || cy >= H) return;
  const i = (cy * W + cx) * 3;
  if (r * k > glow[i]) glow[i] = r * k;                 // 더하지 않고 큰 값만 남겨 색이 하얗게 뭉치지 않게
  if (g * k > glow[i + 1]) glow[i + 1] = g * k;
  if (b * k > glow[i + 2]) glow[i + 2] = b * k;
}
function emit(x, y, vx, vy, o) {                        // 불티 하나
  parts.push({ x, y, vx: vx / CELL, vy, age: 0, life: o.life * uni(.8, 1), drag: o.drag, grav: o.grav,
               c: o.color, hot: o.hot || [255, 255, 255], glitter: !!o.glitter, big: !!o.big,
               then: o.then || null, thenAt: o.thenAt || 1, pop: !!o.pop, ph: uni(0, TAU) });
}
// 날아가던 불티가 다시 갈라지는 방식 세 가지 — 각각 새 불티 목록을 돌려준다
const cross = gen => p => [0, 1, 2, 3].map(q => {         // 십자: 네 갈래로, gen 번 반복
  const a = p.ph + q * Math.PI / 2, sp = gen > 1 ? 8.5 : 5.5;
  return [p.x, p.y, Math.cos(a) * sp, Math.sin(a) * sp,
          { drag: 2.6, grav: 2, life: gen > 1 ? .8 : .65, color: p.c, then: gen > 1 ? cross(gen - 1) : null, thenAt: .55 }];
});
const fork = gen => p => [-1, 1].map(sg => {              // 가지: 가던 방향에서 두 갈래로 벌어진다
  const a = .45 * sg, c = Math.cos(a), sn = Math.sin(a), vx = p.vx * CELL * 1.5, vy = p.vy * 1.5;
  return [p.x, p.y, vx * c - vy * sn, vx * sn + vy * c,
          { drag: 1.7, grav: 2.2, life: .8, color: p.c, then: gen > 1 ? fork(gen - 1) : null, thenAt: .6 }];
});
const mini = (color, n) => p => Array.from({ length: n }, (_, i) => {   // 다단: 작은 꽃으로 한 번 더 터진다
  const a = p.ph + TAU * i / n;
  return [p.x, p.y, Math.cos(a) * 6.5, Math.sin(a) * 6.5, { drag: 3, grav: 1.5, life: .75, color }];
});
function spark(x, y, speed, o) {                         // 구 위의 한 방향으로 튀는 불티
  const a = uni(0, TAU), z = uni(-1, 1), r = Math.sqrt(1 - z * z);
  emit(x, y, Math.cos(a) * r * speed, Math.sin(a) * r * speed, o);
}
function explode(s) {
  const { x, y } = s;
  if (s.big) {                                           // ★ 가운데 주황색 큰 폭죽
    const base = { drag: 1.3, grav: 2.0, color: ORANGE, hot: [255, 235, 180], big: true };
    for (let i = 0; i < 420; i++) spark(x, y, 22.5 * uni(.95, 1), { ...base, life: 3.1 });      // 바깥 껍질
    for (let i = 0; i < 170; i++) spark(x, y, 22.5 * uni(.52, .58), { ...base, life: 2.8 });     // 안쪽 껍질
    for (let i = 0; i < 90; i++) spark(x, y, 22.5 * uni(.08, .28), { ...base, life: 2.3, glitter: true });
    for (let d = -3; d <= 3; d++) for (let e = -2; e <= 2; e++)      // 번쩍
      deposit(x + d, y + e, 255, 225, 170, 1.1 - .2 * Math.hypot(d * CELL, e));
    return;
  }
  const v = s.speed, o = { drag: 2.2, grav: 2.6, life: s.life, color: s.color };
  const GOLD = [255, 215, 90], WHITE = [240, 244, 255];
  switch (s.type) {
    case "peony":                                        // 모란 — 둥글게 꽉 찬 공
      for (let i = 0; i < 110; i++) spark(x, y, v * uni(.88, 1), o);
      break;
    case "double":                                       // 이중 — 색이 다른 속껍질
      for (let i = 0; i < 90; i++) spark(x, y, v * uni(.92, 1), o);
      for (let i = 0; i < 60; i++) spark(x, y, v * uni(.42, .52), { ...o, color: s.color2 });
      break;
    case "chrys": {                                      // 국화 — 곧게 뻗는 살
      const rays = s.instant ? 24 : Math.floor(uni(18, 28)), off = uni(0, TAU);
      for (let i = 0; i < rays; i++) {
        const a = off + TAU * i / rays + uni(-.04, .04);
        for (let j = 0; j < 6; j++)
          emit(x, y, Math.cos(a) * v * (.42 + .115 * j), Math.sin(a) * v * (.42 + .115 * j),
               { ...o, life: s.life * 1.15, color: j === 5 ? s.color2 : s.color });
      }
      break;
    }
    case "ring":                                         // 고리 — 속이 빈 또렷한 원
    case "saturn": {                                     // 토성 — 고리 + 가운데 공
      const tilt = uni(0, Math.PI), sq = s.type === "saturn" ? uni(.3, .45) : uni(.75, 1);
      const ct = Math.cos(tilt), st = Math.sin(tilt), vr = v * 1.15;
      for (let i = 0; i < 96; i++) {
        const a = TAU * i / 96, px = Math.cos(a) * vr, py = Math.sin(a) * vr * sq;
        emit(x, y, px * ct - py * st, px * st + py * ct, { ...o, drag: 1.9, grav: 1.2, life: s.life * 1.1 });
      }
      if (s.type === "saturn")
        for (let i = 0; i < 90; i++) spark(x, y, v * uni(.1, .42), { ...o, color: s.color2, drag: 2.6 });
      break;
    }
    case "ball":                                         // 밀집 — 작고 환한 덩어리
      for (let i = 0; i < 190; i++) spark(x, y, uni(1, 8.5), { ...o, drag: 3, grav: 1.5, life: uni(.9, 1.3), hot: WHITE });
      break;
    case "willow":                                       // 버들 — 길게 늘어지는 금빛 가지
      for (let i = 0; i < 75; i++) spark(x, y, v * uni(.75, 1), { drag: 1.5, grav: 5.5, life: s.life * 1.7, color: GOLD, glitter: true });
      break;
    case "palm": {                                       // 야자 — 굵은 가지 몇 개가 휘어 떨어진다
      const rays = Math.floor(uni(7, 11)), off = uni(0, TAU);
      for (let i = 0; i < rays; i++) {
        const a = off + TAU * i / rays + uni(-.1, .1);
        for (let j = 0; j < 9; j++)
          emit(x + uni(-.5, .5), y, Math.cos(a) * v * uni(.82, 1.05), Math.sin(a) * v * uni(.82, 1.05) - 3,
               { drag: 1.7, grav: 6.5, life: s.life * 1.45, color: j < 6 ? GOLD : s.color });
      }
      break;
    }
    case "crossette":                                    // 십자 — 네 갈래로, 그리고 또 네 갈래로
      for (let i = 0; i < 18; i++) {
        const a = TAU * i / 18 + uni(-.08, .08);
        emit(x, y, Math.cos(a) * v, Math.sin(a) * v, { ...o, drag: 2.4, then: cross(2), thenAt: uni(.4, .48) });
      }
      break;
    case "fork":                                         // 가지 — 뻗어 나가며 두 갈래씩 계속 갈라진다
      for (let i = 0; i < 10; i++) {
        const a = TAU * i / 10 + uni(-.15, .15);
        emit(x, y, Math.cos(a) * v * 1.1, Math.sin(a) * v * 1.1, { ...o, drag: 1.8, life: .8, then: fork(3), thenAt: .6 });
      }
      break;
    case "multi":                                        // 다단 — 불티 하나하나가 작은 꽃으로 다시 터진다
      for (let i = 0; i < 16; i++) {
        const a = TAU * i / 16 + uni(-.1, .1), f = i % 2 ? 1 : .62;
        emit(x, y, Math.cos(a) * v * f, Math.sin(a) * v * f, { ...o, drag: 2.4, life: s.life * .7, then: mini(s.color2, 10) });
      }
      break;
    case "crackle":                                      // 금가루 — 터진 뒤 반짝이며 흩날린다
      for (let i = 0; i < 70; i++) spark(x, y, v * uni(.85, 1), { ...o, life: s.life * .8, pop: true });
      for (let i = 0; i < 70; i++) spark(x, y, v * uni(.2, .95), { drag: 2.6, grav: 1.6, life: uni(1.8, 2.6), color: pick([GOLD, WHITE, s.color2]), glitter: true });
      break;
  }
  for (let d = -1; d <= 1; d++) deposit(x + d, y, 255, 255, 255, 1);
}
function step() {
  simT += DT;
  while (next < SHOWS.length && SHOWS[next].t <= simT) {
    const s = SHOWS[next++];
    if (s.instant) explode(s); else rockets.push({ s, age: 0 });   // instant: 올라오는 모습 없이 바로 터진다
  }
  for (let i = 0; i < N * 3; i++) glow[i] *= DECAY;

  rockets = rockets.filter(r => {                        // 올라가는 폭죽
    r.age += DT;
    const u = r.age / r.s.rise;
    if (u >= 1) { explode(r.s); return false; }
    const y = GROUND + (r.s.y - GROUND) * (1 - (1 - u) * (1 - u));
    const x = r.s.x + .6 * Math.sin(r.age * 9 + r.s.x);
    if (r.s.big) deposit(x, y, 255, 170, 70, 1.3); else deposit(x, y, 255, 235, 200, .8);
    return true;
  });

  const born = [];
  parts = parts.filter(p => {                            // 터진 불티
    p.age += DT;
    if (p.then && p.age >= p.life * p.thenAt) {          // 갈라지기
      for (const child of p.then(p)) born.push(child);
      deposit(p.x, p.y, 255, 255, 255, .9);
      return false;
    }
    if (p.age >= p.life) {
      if (p.pop) born.push([p.x, p.y, uni(-2, 2), uni(-2, 2), { drag: 3, grav: 1, life: .35, color: [255, 250, 230] }]);
      return false;
    }
    const k = Math.exp(-p.drag * DT);
    p.vx *= k; p.vy = p.vy * k + p.grav * DT;
    p.x += p.vx * DT; p.y += p.vy * DT;
    const u = p.age / p.life;
    let br = Math.pow(1 - u, .9);
    if (p.glitter && u > .35) br *= Math.sin(simT * 22 + p.ph) > .2 ? 1.3 : .15;   // 반짝이
    else if (u > .7) br *= Math.sin(simT * 30 + p.ph) > -.3 ? 1 : .3;
    const h = clamp(1 - u * (p.big ? 9 : 10), 0, 1);      // 처음엔 하얗게 달궈져 있다
    let r = p.c[0] + (p.hot[0] - p.c[0]) * h, g = p.c[1] + (p.hot[1] - p.c[1]) * h, b = p.c[2] + (p.hot[2] - p.c[2]) * h;
    if (p.big && u > .55) { const e = (u - .55) / .45; g *= 1 - .5 * e; b *= 1 - .7 * e; } // 끝은 붉게 식는다
    deposit(p.x, p.y, r, g, b, br);
    return true;
  });
  for (const [x, y, vx, vy, o] of born) emit(x, y, vx, vy, o);
  for (const c of cars) c.x = ((c.x + c.v * DT) % W + W) % W;

  for (const c of textCells) {                           // 하늘의 글자 — 반짝이며 떠 있다가 불티로 흩어진다
    if (c.gone || simT < c.at) continue;
    if (simT >= c.end) {
      c.gone = true;
      emit(c.x, c.y, uni(-1.2, 1.2), uni(-.5, 2), { drag: 1, grav: 3.2, life: uni(.5, 1.2), color: c.col, glitter: c.w === 1 });
      continue;
    }
    const tt = simT - c.at, tw = Math.sin(simT * 5 + c.ph), flash = Math.max(0, 1 - tt * 2.5);
    const br = Math.min(1, tt * 4) * c.w * (.93 + .07 * tw) + flash * .4;
    const wht = Math.max(flash, tw > .93 ? 1 : 0);          // 가끔 하얗게 반짝
    deposit(c.x, c.y, c.col[0] + (255 - c.col[0]) * wht, c.col[1] + (255 - c.col[1]) * wht, c.col[2] + (255 - c.col[2]) * wht, br);
  }
}
function reset() {
  rockets = []; parts = []; next = 0; simT = 0; glow.fill(0);
  for (const c of textCells) c.gone = false;
  rnd = mulberry32(7);
}

// ── 4. 한 프레임 그리기 ──────────────────────────────────────
const ch = new Uint16Array(N), rgb = new Float32Array(N * 3);
function frame() {
  ch.fill(0);
  for (const s of stars) {
    const g = 210 * s.br * (.6 + .4 * Math.sin(simT * s.w + s.ph));
    ch[s.i] = s.ch; rgb[s.i * 3] = g; rgb[s.i * 3 + 1] = g; rgb[s.i * 3 + 2] = g * 1.1;
  }
  for (let i = 0; i < N; i++) {
    const y = (i / W) | 0, x = i % W;
    let r = glow[i * 3], g = glow[i * 3 + 1], b = glow[i * 3 + 2], m = Math.max(r, g, b);
    if (cityCh[i] && cityCh[i] !== 32) {                 // 다리는 불빛을 살짝 받는다
      const lift = Math.min(1, m / 300);
      ch[i] = cityCh[i];
      rgb[i * 3] = cityRgb[i * 3] + r * .2 * lift; rgb[i * 3 + 1] = cityRgb[i * 3 + 1] + g * .2 * lift;
      rgb[i * 3 + 2] = cityRgb[i * 3 + 2] + b * .2 * lift;
      continue;
    }
    if (y > DECK + 1) {                                  // 강물 — 하늘의 불꽃이 일렁이며 비친다
      const sy = DECK - Math.round((y - DECK - 1) * 3.4);
      const sx = x + Math.round(1.6 * Math.sin(y * 1.7 + simT * 2.2 + x * .15));
      let wr = 0, wg = 0, wb = 0;
      if (sy >= 0 && sx >= 0 && sx < W)
        for (let d = 0; d < 3; d++) { const j = ((sy - d) * W + sx) * 3; if (sy - d < 0) break;
          wr = Math.max(wr, glow[j]); wg = Math.max(wg, glow[j + 1]); wb = Math.max(wb, glow[j + 2]); }
      const wm = Math.max(wr, wg, wb) * .5;
      if (wm > 14) {
        const k = .5 * (.5 + .5 * Math.min(1, wm / 128)) / Math.min(1, Math.max(wr, wg, wb) / 255);
        ch[i] = code(wm > 80 ? "=" : wm > 40 ? "~" : "-");
        rgb[i * 3] = wr * k; rgb[i * 3 + 1] = wg * k; rgb[i * 3 + 2] = wb * k;
      } else if ((x * 7 + y * 13 + Math.floor(simT * 1.5 + y * .7)) % 19 === 0) {
        ch[i] = code("~"); rgb[i * 3] = 28; rgb[i * 3 + 1] = 42; rgb[i * 3 + 2] = 78;
      }
      continue;
    }
    if (m < 16) continue;
    const k = Math.min(1, 255 / m) * (.45 + .55 * Math.min(1, m / 255));   // 잔상 꼬리는 어둡게
    ch[i] = RAMP.charCodeAt(clamp(Math.floor(m / 255 * RAMP.length), 0, RAMP.length - 1));
    rgb[i * 3] = r * k / Math.min(1, m / 255); rgb[i * 3 + 1] = g * k / Math.min(1, m / 255); rgb[i * 3 + 2] = b * k / Math.min(1, m / 255);
  }
  const dot = (x, y, c, col) => { const i = y * W + x; ch[i] = code(c); rgb[i * 3] = col[0]; rgb[i * 3 + 1] = col[1]; rgb[i * 3 + 2] = col[2]; };
  for (const x of lamps) {                               // 가로등과 물에 비친 불빛
    dot(x, DECK - 1, "o", [255, 214, 130]);
    for (let d = 2; d < 5; d++) if (Math.sin(simT * 3 + x + d * 2) > -.2) dot(x + (d > 3 ? Math.round(Math.sin(simT * 2 + x)) : 0), DECK + d, d < 3 ? ":" : ".", [150 - d * 22, 120 - d * 18, 60]);
  }
  for (const c of cars) dot(Math.floor(c.x), DECK, c.v > 0 ? "»" : "«", c.v > 0 ? [255, 250, 225] : [255, 80, 70]);
  if (Math.sin(simT * 3.2) > 0) for (const tx of TOWERS) dot(tx, TOP - 3, "*", [255, 60, 50]);   // 항공 장애등
}

// ── 5. 화면에 출력 ───────────────────────────────────────────
const cv = document.getElementById("screen"), ctx = cv.getContext("2d");
const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';
let cw = 8, chH = 14, fs = 13;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = cv.getBoundingClientRect().width || 560;
  cw = Math.max(3, cssW * dpr / W);
  fs = cw / .6; chH = cw / CELL;
  cv.width = Math.round(cw * W); cv.height = Math.round(chH * H);
}
function paint() {
  ctx.fillStyle = "#07080d"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.font = `${fs}px ${FONT}`; ctx.textBaseline = "top"; ctx.textAlign = "center";
  let last = -1;
  for (let i = 0; i < N; i++) {
    if (!ch[i]) continue;
    const r = Math.min(255, rgb[i * 3]) | 0, g = Math.min(255, rgb[i * 3 + 1]) | 0, b = Math.min(255, rgb[i * 3 + 2]) | 0;
    const key = r << 16 | g << 8 | b;
    if (key !== last) { ctx.fillStyle = `rgb(${r},${g},${b})`; last = key; }
    ctx.fillText(String.fromCharCode(ch[i]), ((i % W) + .5) * cw, ((i / W) | 0) * chH);
  }
}

// ── 6. 반복 실행 ─────────────────────────────────────────────
reset();
const START = parseFloat(new URLSearchParams(location.search).get("t")) || 0;   // ?t=11 처럼 특정 시점부터 보기
while (simT < START) step();
let clock = performance.now(), debt = 0;
function tick(now) {
  requestAnimationFrame(tick);
  debt = Math.min(debt + (now - clock) / 1000, 5 * DT);
  clock = now;
  if (debt < DT) return;
  while (debt >= DT) { step(); debt -= DT; if (simT >= T_LOOP) reset(); }
  frame(); paint();
}
resize();
window.addEventListener("resize", resize);
requestAnimationFrame(tick);
</script>
</body>
