<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            property="og:image"
            content="https://fish-minkyu.github.io/4ulog/image/cassettePlayer/cassette-main.webp"
        />
        <title>어민규의 추천 플레이 리스트</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,600;1,800&family=Gaegu:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap"
        />
        <link rel="stylesheet" href="css/cassettePlayer.css" />
    </head>
    <body>
        <main class="app">
            <!-- 플레이어 본체: 빈 덱 그림 위에 테이프와 버튼을 겹쳐 놓습니다 -->
            <section class="deck" id="deck" aria-label="카세트 플레이어">
                <img
                    class="deck-img"
                    src="./image/cassettePlayer/player.webp"
                    alt="빨간 레트로 카세트 플레이어"
                    width="1000"
                    height="1098"
                />
                <div class="tape-slot" id="tapeSlot"></div>
                <!-- 액정: 재생 중인 곡 정보 -->
                <div class="lcd" id="lcd">
                    <div class="lcd-glass">
                        <p class="lcd-line" aria-live="polite">
                            <span class="lcd-title" id="lcdTitle">NO TAPE</span>
                        </p>
                        <p class="lcd-row">
                            <span id="lcdState">STOP</span>
                            <span id="lcdNo">--/--</span>
                            <span id="lcdTime">0:00 / 0:00</span>
                        </p>
                        <div class="lcd-fill" id="lcdFill"></div>
                    </div>
                </div>
                <div class="keys" id="keys">
                    <button
                        class="key"
                        id="keyRew"
                        type="button"
                        aria-label="되감기 (이전 곡)"
                    ></button>
                    <button
                        class="key"
                        id="keyPlay"
                        type="button"
                        aria-label="재생"
                        aria-pressed="false"
                    ></button>
                    <button
                        class="key"
                        id="keyFf"
                        type="button"
                        aria-label="빨리 감기 (다음 곡)"
                    ></button>
                    <button
                        class="key"
                        id="keyStop"
                        type="button"
                        aria-label="정지"
                    ></button>
                    <button
                        class="key"
                        id="keyEject"
                        type="button"
                        aria-label="테이프 꺼내기"
                    ></button>
                </div>
            </section>

            <!-- 테이프 선반 -->
            <section class="shelf-wrap">
                <!-- <h2 class="head">테이프</h2> -->
                <div class="shelf" id="shelf"></div>
            </section>

            <!-- 곡 목록 -->
            <section class="card">
                <h2 class="head" id="listHead">수록곡</h2>
                <ol class="tracks" id="tracks"></ol>
            </section>
        </main>
        <script src="js/tapes.js"></script>
        <script src="js/player.js"></script>
    </body>
</html>
