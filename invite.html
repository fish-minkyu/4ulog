        <style>
            :root {
                --sage: #7c9885;
                --sage-deep: #5c7a68;
                --sage-soft: #d7e3d9;
                --cream: #f7f5ee;
                --ink: #3f4a41;
                --muted: #7d8a80;
                --card: #fffefb;
                --accent: #c7a06b; /* warm oat accent */
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                font-family: "Gaegu", cursive;
                background:
                    radial-gradient(
                        1200px 600px at 15% 0%,
                        #eef2e9 0%,
                        transparent 60%
                    ),
                    radial-gradient(
                        1000px 500px at 100% 100%,
                        #e9efe6 0%,
                        transparent 55%
                    ),
                    var(--cream);
                color: var(--ink);
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                overflow-x: hidden;
            }
            .leaf {
                position: fixed;
                top: -40px;
                font-size: 20px;
                opacity: 0.6;
                animation: fall linear infinite;
                pointer-events: none;
                z-index: 0;
            }
            @keyframes fall {
                0% {
                    transform: translateY(-40px) rotate(0deg);
                }
                100% {
                    transform: translateY(105vh) rotate(300deg);
                }
            }

            .stage {
                width: 100%;
                max-width: 440px;
                position: relative;
                z-index: 1;
            }
            .card {
                background: var(--card);
                border-radius: 24px;
                padding: 36px 28px 40px;
                box-shadow:
                    0 18px 46px rgba(92, 122, 104, 0.2),
                    0 2px 0 #eef2e9 inset;
                border: 2px solid #e5ece2;
                text-align: center;
                position: relative;
            }
            .step {
                display: none;
                animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            }
            .step.active {
                display: block;
            }
            @keyframes pop {
                from {
                    opacity: 0;
                    transform: scale(0.94) translateY(10px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }

            .cat {
                width: 240px;
                height: 240px;
                border-radius: 24px;
                object-fit: cover;
                margin: 0 auto 10px;
                display: block;
                box-shadow: 0 10px 22px rgba(92, 122, 104, 0.24);
            }
            .emoji-hero {
                font-size: 50px;
                line-height: 1;
                margin-bottom: 4px;
            }

            h1 {
                font-family: "Jua", sans-serif;
                font-size: 29px;
                margin: 14px 0 6px;
                color: var(--sage-deep);
                letter-spacing: 0.5px;
            }
            h2 {
                font-family: "Jua", sans-serif;
                font-size: 25px;
                margin: 10px 0 18px;
                color: var(--sage-deep);
            }

            .btn {
                font-family: "Jua", sans-serif;
                border: none;
                cursor: pointer;
                border-radius: 999px;
                padding: 15px 26px;
                font-size: 20px;
                color: #fff;
                background: linear-gradient(
                    135deg,
                    var(--sage),
                    var(--sage-deep)
                );
                box-shadow: 0 10px 20px rgba(92, 122, 104, 0.35);
                transition:
                    transform 0.15s ease,
                    box-shadow 0.15s ease;
                width: 100%;
            }
            .btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 14px 26px rgba(92, 122, 104, 0.42);
            }
            .btn:active {
                transform: translateY(0);
            }

            .yesno {
                position: relative;
                height: 150px;
                margin-top: 8px;
            }
            #yesBtn {
                position: absolute;
                left: 50%;
                top: 14px;
                transform: translateX(-50%);
                width: auto;
                padding: 16px 44px;
                font-size: 22px;
            }
            #noBtn {
                position: absolute;
                left: 50%;
                top: 86px;
                transform: translateX(-50%);
                background: #e4e9e2;
                color: #8a978c;
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.06);
                padding: 12px 30px;
                font-size: 18px;
                width: auto;
                transition:
                    left 0.18s ease,
                    top 0.18s ease;
                z-index: 3;
            }

            .field {
                text-align: left;
                margin: 16px 0;
            }
            .field label {
                display: block;
                font-size: 19px;
                margin-bottom: 6px;
                color: var(--muted);
                font-weight: 700;
            }
            .field input {
                width: 100%;
                padding: 13px 14px;
                font-size: 18px;
                font-family: "Gaegu", cursive;
                border: 2px solid var(--sage-soft);
                border-radius: 14px;
                background: #fff;
                color: var(--ink);
                outline: none;
                transition: border-color 0.15s;
            }
            .field input:focus {
                border-color: var(--sage);
            }
            .note {
                font-size: 15px;
                color: var(--accent);
                margin-top: -8px;
                margin-bottom: 6px;
                text-align: left;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 12px;
                margin: 18px 0 6px;
            }
            .choice {
                border: 2px solid var(--sage-soft);
                border-radius: 18px;
                background: #fff;
                padding: 16px 12px;
                cursor: pointer;
                transition: all 0.15s;
                font-family: "Gaegu", cursive;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 12px;
            }
            .choice .ic {
                font-size: 34px;
            }
            .choice .lb {
                font-size: 18px;
                font-weight: 700;
                color: var(--ink);
            }
            .choice:hover {
                transform: translateY(-2px);
                border-color: var(--sage);
            }
            .choice.selected {
                border-color: var(--sage-deep);
                background: linear-gradient(135deg, #f0f4ec, #e4ece2);
                box-shadow: 0 8px 16px rgba(92, 122, 104, 0.22);
            }

            .final-msg {
                text-align: center;
            }
            .final-msg .big {
                font-size: 54px;
                margin-bottom: 8px;
            }
            .summary {
                background: #f2f5ee;
                border: 2px dashed var(--sage);
                border-radius: 16px;
                padding: 16px;
                margin: 16px 0;
                font-size: 19px;
                line-height: 1.5;
                text-align: left;
                color: var(--ink);
            }
            .summary b {
                color: var(--sage-deep);
            }
            .status {
                font-size: 16px;
                margin-top: 10px;
                min-height: 22px;
                color: var(--muted);
            }
            .hint {
                font-size: 14px;
                color: #a9b3a8;
                margin-top: 14px;
            }
        </style>
    </head>

                        <div class="summary" id="summary"></div>
                        <div class="status" id="status2"></div>
                    </div>

        </div>

        <script>
            /* =========================================================
   ⚙️  이메일 설정 (EmailJS)
   아래 3개 값을 채우면 e951219@naver.com 으로 자동 전송.
   비워두면 메일 앱(mailto) 방식으로 대체.
   가입: https://www.emailjs.com  (무료)
   ========================================================= */
            const EMAILJS_PUBLIC_KEY = "l1i306yql3aXwvSZN";
            const EMAILJS_SERVICE_ID = "service_8brfeao";
            const EMAILJS_TEMPLATE_ID = "template_60rbwvd";
            const TO_EMAIL = "e951219@naver.com";

            if (EMAILJS_PUBLIC_KEY) {
                emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
            }

            function goStep(n) {
                document
                    .querySelectorAll(".step")
                    .forEach((s) => s.classList.remove("active"));
                document.getElementById("step" + n).classList.add("active");
            }

            /* STEP1: 도망가는 "아니" */
            const noBtn = document.getElementById("noBtn");
            const card = noBtn.closest(".card");
            function runAway() {
                const r = card.getBoundingClientRect();
                const pad = 12;
                const maxX = r.width - noBtn.offsetWidth - pad * 2;
                const maxY = r.height - noBtn.offsetHeight - pad * 2;
                const x = pad + Math.random() * Math.max(maxX, 0);
                const y = pad + Math.random() * Math.max(maxY, 0);
                noBtn.style.left = x + "px";
                noBtn.style.top = y + "px";
                noBtn.style.transform = "none";
            }
            noBtn.addEventListener("mouseenter", runAway);
            noBtn.addEventListener("mousedown", runAway);
            noBtn.addEventListener(
                "touchstart",
                function (e) {
                    e.preventDefault();
                    runAway();
                },
                { passive: false },
            );

            /* STEP2: 날짜/시간 — 주말만 허용 */
            const dateInput = document.getElementById("dateInput");
            // 오늘 이후만 선택 가능하게 최소값 지정
            (function () {
                const t = new Date();
                const min = t.toISOString().split("T")[0];
                dateInput.setAttribute("min", min);
            })();
            // 평일을 고르면 바로 되돌리고 안내
            dateInput.addEventListener("change", function () {
                if (!this.value) return;
                const day = new Date(this.value + "T00:00:00").getDay(); // 0=일,6=토
                if (day !== 0 && day !== 6) {
                    alert("평일은 안 돼~ 주말(토요일·일요일)로 골라줘 🌿");
                    this.value = "";
                }
            });

            let chosenDate = "";
            let chosenTime = "";
            function submitDate() {
                const d = dateInput.value;
                const t = document.getElementById("timeInput").value;
                if (!d) {
                    alert("날짜를 골라줘 (주말만 돼) 🌿");
                    return;
                }
                const day = new Date(d + "T00:00:00").getDay();
                if (day !== 0 && day !== 6) {
                    alert("주말(토·일)만 고를 수 있어 🌿");
                    return;
                }
                if (!t) {
                    alert("시간도 골라줘");
                    return;
                }
                chosenDate = d;
                chosenTime = t;
                goStep(3);
            }

            /* STEP3: 활동 선택 */
            let chosenActivity = "";
            let sent = false;
            function pick(el) {
                if (sent) return; // 중복 전송 방지
                document
                    .querySelectorAll(".choice")
                    .forEach((c) => c.classList.remove("selected"));
                el.classList.add("selected");
                chosenActivity = el.dataset.act;
                sent = true;
                finish(); // 고르는 즉시 전송
            }

            /* 마무리 & 이메일 */
            function finish() {
                const dayName = ["일", "월", "화", "수", "목", "금", "토"][
                    new Date(chosenDate + "T00:00:00").getDay()
                ];
                const summaryHTML =
                    `🗓️ 날짜: <b>${chosenDate} (${dayName})</b><br>` +
                    `⏰ 시간: <b>${chosenTime}</b><br>` +
                    `🎯 뭐할까: <b>${chosenActivity}</b>`;
                const plainText =
                    `같이 놀자는 답장이 왔어요!\n\n` +
                    `날짜: ${chosenDate} (${dayName}요일)\n` +
                    `시간: ${chosenTime}\n` +
                    `뭐하고 놀까: ${chosenActivity}`;

                goStep(4);
                document.getElementById("summary").innerHTML = summaryHTML;
                const status2 = document.getElementById("status2");

                if (
                    EMAILJS_PUBLIC_KEY &&
                    EMAILJS_SERVICE_ID &&
                    EMAILJS_TEMPLATE_ID
                ) {
                    status2.textContent = "전송 중... 💨";
                    emailjs
                        .send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                            to_email: TO_EMAIL,
                            date: chosenDate,
                            time: chosenTime,
                            activity: chosenActivity,
                            message: plainText,
                        })
                        .then(function () {
                            status2.textContent = "메일함으로 잘 보냈어! 💌";
                        })
                        .catch(function (err) {
                            console.error(err);
                            status2.innerHTML =
                                "앗, 자동전송 실패 😢 아래 버튼으로 보내줘<br>" +
                                mailtoButton(plainText);
                        });
                } else {
                    status2.innerHTML =
                        "아래 버튼을 누르면 메일 앱이 열려요 💌<br>" +
                        mailtoButton(plainText) +
                        '<div class="hint">자동 전송을 원하면 코드 상단 EmailJS 값을 채워줘</div>';
                }
            }

            function mailtoButton(text) {
                const subject = encodeURIComponent("같이 놀 약속 잡혔어!");
                const body = encodeURIComponent(text);
                const href = `mailto:${TO_EMAIL}?subject=${subject}&body=${body}`;
                return `<a class="btn" style="display:inline-block;text-decoration:none;margin-top:10px;" href="${href}">메일로 보내기 ✉️</a>`;
            }

            /* 배경 잎사귀 */
            (function () {
                const leaves = ["🌿", "🍃", "🌱", "🌾"];
                for (let i = 0; i < 14; i++) {
                    const el = document.createElement("div");
                    el.className = "leaf";
                    el.textContent = leaves[i % leaves.length];
                    el.style.left = Math.random() * 100 + "vw";
                    el.style.animationDuration = 7 + Math.random() * 7 + "s";
                    el.style.animationDelay = Math.random() * 8 + "s";
                    el.style.fontSize = 14 + Math.random() * 16 + "px";
                    document.body.appendChild(el);
                }
            })();
        </script>
    </body>
</html>
