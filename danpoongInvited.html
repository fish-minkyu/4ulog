<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사유록 · 명륜당 단풍 산책</title>

<!-- 카카오톡·인스타 링크 미리보기용 (og:image는 저장소에 이미지 올린 뒤 주소 바꾸기) -->
<meta property="og:title" content="사유록 · 명륜당 단풍 산책">
<meta property="og:description" content="11월 7일 토요일, 성균관 명륜당 은행나무 아래에서 만나요.">
<meta property="og:type" content="website">
<!-- <meta property="og:image" content="https://아이디.github.io/저장소이름/og.jpg"> -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;800&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #f6efe2;
    --paper-deep: #ece1cc;
    --ink: #2b2118;
    --ink-soft: #6b5a48;
    --ginkgo: #e0a526;
    --maple: #b8432b;
    --line: #cdbb9d;
    --bg: #2a1f17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #4a3322 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: "Gowun Batang", serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    padding: 48px 16px 80px;
  }

  /* 떨어지는 잎 */
  #leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .leaf {
    position: absolute; top: -40px;
    animation: fall linear forwards;
    opacity: .9;
  }
  @keyframes fall {
    to { transform: translate(var(--drift), 110vh) rotate(var(--spin)); }
  }

  /* 봉투 */
  .stage { position: relative; z-index: 1; width: 100%; max-width: 440px; }
  .envelope {
    position: relative; cursor: pointer;
    background: var(--paper-deep);
    border-radius: 6px;
    aspect-ratio: 4 / 3;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    transition: transform .6s ease, opacity .6s ease;
  }
  .envelope::before {               /* 덮개 */
    content: ""; position: absolute; inset: 0 0 auto 0; height: 55%;
    background: var(--paper);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-bottom: 1px solid var(--line);
  }
  .seal {
    position: relative; z-index: 2;
    width: 74px; height: 74px; border-radius: 50%;
    background: var(--maple);
    color: var(--paper);
    display: grid; place-items: center;
    font-family: "Nanum Myeongjo", serif; font-weight: 800; font-size: 22px;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.15), 0 4px 10px rgba(0,0,0,.3);
    margin-top: 18%;
  }
  .hint {
    text-align: center; color: #d9c7a8; margin-top: 18px; font-size: 14px;
    letter-spacing: .1em; animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .35; } }
  .opened .envelope { transform: translateY(-20px) scale(.92); opacity: 0; pointer-events: none; position: absolute; width: 100%; }
  .opened .hint { display: none; }

  /* 카드 */
  .card {
    display: none;
    background: var(--paper);
    background-image:
      linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,0)),
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(120,90,50,.025) 3px 4px);
    border-radius: 4px;
    padding: 44px 32px 36px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    position: relative;
    text-align: center;
  }
  .card::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid var(--line); border-radius: 2px; pointer-events: none;
  }
  .opened .card { display: block; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(40px); } }

  .hero {
    position: relative; z-index: 1;
    margin: -24px -12px 28px;
    aspect-ratio: 400 / 260;
    overflow: hidden; border-radius: 2px;
    background: #f3d9a4;
  }
  .hero-art, .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-photo { object-fit: cover; }

  .gallery {
    position: relative; z-index: 1;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 6px;
    margin-top: 26px;
  }
  .gallery figure { aspect-ratio: 1; overflow: hidden; border-radius: 2px; background: var(--paper-deep); }
  .gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .gallery img:hover { transform: scale(1.05); }
  .gallery:empty { display: none; }

  .club { font-size: 13px; letter-spacing: .5em; color: var(--ink-soft); padding-left: .5em; }
  .divider { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 18px 0; color: var(--ginkgo); }
  .divider span { height: 1px; width: 48px; background: var(--line); }
  h1 {
    font-family: "Nanum Myeongjo", serif; font-weight: 800;
    font-size: clamp(30px, 8vw, 40px); line-height: 1.3; letter-spacing: -.01em;
  }
  h1 em { font-style: normal; color: var(--maple); }
  .lead { margin-top: 18px; line-height: 1.95; color: var(--ink-soft); font-size: 15.5px; word-break: keep-all; }

  .info { margin: 30px 0 8px; border-top: 1px solid var(--line); text-align: left; }
  .row { display: flex; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row dt { flex: 0 0 52px; color: var(--ink-soft); letter-spacing: .15em; }
  .row dd { flex: 1; line-height: 1.6; word-break: keep-all; }
  .row dd small { display: block; color: var(--ink-soft); font-size: 13px; }

  .dday {
    margin: 26px auto 0; font-family: "Nanum Myeongjo", serif;
    font-size: 15px; color: var(--ink-soft);
  }
  .dday b { color: var(--maple); font-size: 26px; font-weight: 800; margin: 0 4px; }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 28px; position: relative; z-index: 1; }
  .btn {
    display: block; padding: 14px; border-radius: 3px; text-decoration: none;
    font-family: inherit; font-size: 15px; letter-spacing: .05em; cursor: pointer;
    transition: transform .15s ease, background .2s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
  .btn.primary:hover { background: #45362a; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: rgba(0,0,0,.03); }

  .sign { margin-top: 30px; font-size: 13px; color: var(--ink-soft); letter-spacing: .1em; }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: all .3s ease; z-index: 5;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* "함께할게요" 메시지 박스 */
  .vote-box {
    position: fixed; left: 50%; top: 50%; z-index: 10;
    transform: translate(-50%, -50%);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 34px;
    box-shadow: 0 18px 40px rgba(0,0,0,.35);
    font-family: "Nanum Myeongjo", serif; font-weight: 800;
    font-size: 20px; color: var(--maple);
    text-align: center; white-space: nowrap;
    pointer-events: none;
    opacity: 0; visibility: hidden;
  }
  .vote-box.show {
    visibility: visible;
    /* 0.3초 동안 나타나고 → 3초 머문 뒤 → 0.8초 동안 서서히 사라짐 */
    animation:
      vote-in .3s ease-out forwards,
      vote-out .8s ease-in 3.3s forwards;
  }
  @keyframes vote-in {
    from { opacity: 0; transform: translate(-50%, -40%) scale(.95); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes vote-out {
    from { opacity: 1; }
    to   { opacity: 0; visibility: hidden; }
  }

  @media (prefers-reduced-motion: reduce) {
    .leaf, .hint, .opened .card { animation: none !important; }
  }
</style>
<script>
  // 없는 사진은 칸째로 숨기고, 전부 없으면 사진첩도 숨김
  function dropPhoto(img) {
    const fig = img.closest('figure'), g = img.closest('.gallery');
    fig.remove();
    if (!g.querySelector('figure')) g.remove();
  }
</script>
</head>
<body>

<div id="leaves" aria-hidden="true"></div>

<main class="stage" id="stage">
  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="초대장 열기">
    <div class="seal">思</div>
  </div>
  <p class="hint">봉투를 눌러 열어보세요</p>

  <article class="card">
    <!-- 대표 사진: photos/hero.jpg 를 올리면 사진으로, 없으면 일러스트로 보여요 -->
    <figure class="hero">
      <svg class="hero-art" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f3d9a4"/><stop offset="1" stop-color="#f7ead0"/>
          </linearGradient>
          <radialGradient id="crown" cx=".5" cy=".45" r=".6">
            <stop offset="0" stop-color="#f6c742"/><stop offset=".7" stop-color="#e3a422"/><stop offset="1" stop-color="#c98614"/>
          </radialGradient>
        </defs>
        <rect width="400" height="260" fill="url(#sky)"/>
        <!-- 명륜당 -->
        <g transform="translate(200 150)">
          <rect x="-70" y="10" width="140" height="44" fill="#8a5a3c"/>
          <rect x="-62" y="16" width="124" height="34" fill="#5d3a26"/>
          <g fill="#c9a882">
            <rect x="-56" y="20" width="22" height="30"/><rect x="-28" y="20" width="22" height="30"/>
            <rect x="6" y="20" width="22" height="30"/><rect x="34" y="20" width="22" height="30"/>
          </g>
          <path d="M-96 12 Q-80 -2 -60 -14 L60 -14 Q80 -2 96 12 Q60 4 0 4 Q-60 4 -96 12Z" fill="#3a2a22"/>
          <path d="M-60 -14 Q-40 -30 0 -32 Q40 -30 60 -14Z" fill="#4a3529"/>
          <rect x="-80" y="54" width="160" height="8" fill="#b9a183"/>
        </g>
        <!-- 은행나무 두 그루 -->
        <g>
          <rect x="70" y="140" width="12" height="80" fill="#5a3d2b"/>
          <circle cx="76" cy="110" r="58" fill="url(#crown)"/>
          <circle cx="40" cy="135" r="34" fill="url(#crown)"/>
          <circle cx="112" cy="132" r="36" fill="url(#crown)"/>
          <circle cx="76" cy="62" r="34" fill="url(#crown)"/>
        </g>
        <g>
          <rect x="318" y="140" width="12" height="80" fill="#5a3d2b"/>
          <circle cx="324" cy="108" r="60" fill="url(#crown)"/>
          <circle cx="288" cy="134" r="34" fill="url(#crown)"/>
          <circle cx="362" cy="130" r="38" fill="url(#crown)"/>
          <circle cx="324" cy="58" r="34" fill="url(#crown)"/>
        </g>
        <!-- 노란 마당 -->
        <path d="M0 214 Q200 200 400 214 L400 260 L0 260Z" fill="#e8b73a"/>
        <g fill="#f4cf5a" opacity=".9">
          <ellipse cx="60" cy="236" rx="6" ry="2.5"/><ellipse cx="130" cy="246" rx="5" ry="2"/>
          <ellipse cx="210" cy="232" rx="6" ry="2.5"/><ellipse cx="270" cy="248" rx="5" ry="2"/>
          <ellipse cx="350" cy="238" rx="6" ry="2.5"/><ellipse cx="170" cy="252" rx="4" ry="2"/>
        </g>
      </svg>
      <img class="hero-photo" src="photos/hero.jpg" alt="명륜당 앞 은행나무" onerror="this.remove()">
    </figure>

    <p class="club">사 유 록</p>
    <div class="divider"><span></span>🍂<span></span></div>

    <h1>명륜당,<br><em>가을</em>을 걷다</h1>

    <p class="lead">
      은행잎이 가장 노랗게 물드는 때,<br>
      오래된 마당에서 천천히 걷고<br>
      생각을 나누는 하루를 보내려 합니다.<br>
      함께해 주시면 좋겠습니다.
    </p>

    <!-- 사진첩: photos/1.jpg ~ 3.jpg 를 올리면 보이고, 없는 사진은 자동으로 숨겨져요 -->
    <section class="gallery" id="gallery">
      <figure><img src="photos/1.jpg" alt="" onerror="dropPhoto(this)"></figure>
      <figure><img src="photos/2.jpg" alt="" onerror="dropPhoto(this)"></figure>
      <figure><img src="photos/3.jpg" alt="" onerror="dropPhoto(this)"></figure>
    </section>

    <dl class="info">
      <div class="row">
        <dt>일시</dt>
        <dd>2026년 11월 7일 토요일<br><!-- ✏️ 시간 수정 -->오후 2시</dd>
      </div>
      <div class="row">
        <dt>장소</dt>
        <dd>성균관 명륜당
          <small>성균관대 인문사회과학캠퍼스 안</small></dd>
      </div>
      <div class="row">
        <dt>집합</dt>
        <dd><!-- ✏️ 집합 장소 수정 -->혜화역 4번 출구
          <small>모여서 함께 걸어가요</small></dd>
      </div>
    </dl>

    <p class="dday" id="dday"></p>

    <div class="actions">
      <!-- ✏️ 참석 신청 링크(오픈채팅, 구글폼 등)로 바꾸기 -->
      <a class="btn primary" href="#" id="rsvp">함께할게요</a>
      <a class="btn ghost" href="https://map.naver.com/p/search/%EC%84%B1%EA%B7%A0%EA%B4%80%20%EB%AA%85%EB%A5%9C%EB%8B%B9" target="_blank" rel="noopener">지도 보기</a>
      <button class="btn ghost" id="share">초대장 링크 복사</button>
    </div>
    
  </article>
</main>

<div class="toast" id="toast"></div>
<div class="vote-box" id="voteBox" role="status" aria-live="polite">투표해줭! 🍁</div>

<script>
  // ---- 봉투 열기 ----
  const stage = document.getElementById('stage');
  const env = document.getElementById('envelope');
  const open = () => { stage.classList.add('opened'); burst(18); };
  env.addEventListener('click', open);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') open(); });

  // ---- D-day ----
  (function () {
    const target = new Date('2026-11-07T00:00:00+09:00');
    const now = new Date();
    const today = new Date(now.toLocaleDateString('en-CA', { timeZone: 'Asia/Seoul' }) + 'T00:00:00+09:00');
    const diff = Math.round((target - today) / 86400000);
    const el = document.getElementById('dday');
    if (diff > 0) el.innerHTML = `만나기까지<b>D-${diff}</b>`;
    else if (diff === 0) el.innerHTML = `<b>오늘</b>이에요!`;
    else el.textContent = '함께해 주셔서 고마웠어요';
  })();

  // ---- 링크 복사 ----
  const toast = msg => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  };
  document.getElementById('share').addEventListener('click', async () => {
    try {
      if (navigator.share) { await navigator.share({ title: document.title, url: location.href }); return; }
      await navigator.clipboard.writeText(location.href);
      toast('링크를 복사했어요');
    } catch (e) { toast('주소창의 링크를 복사해 주세요'); }
  });
  // ---- "함께할게요" → 투표 메시지 ----
  const voteBox = document.getElementById('voteBox');
  document.getElementById('rsvp').addEventListener('click', e => {
    e.preventDefault();
    voteBox.classList.remove('show');
    void voteBox.offsetWidth;          // 연달아 눌러도 애니메이션이 처음부터 다시 재생되게
    voteBox.classList.add('show');
  });

  // ---- 떨어지는 은행잎 / 단풍잎 ----
  const box = document.getElementById('leaves');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ginkgo = c => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path fill="${c}" d="M20 38 L20 24 M20 24 C8 24 2 14 4 6 C10 10 16 8 20 4 C24 8 30 10 36 6 C38 14 32 24 20 24Z" stroke="${c}" stroke-width="1.5"/></svg>`;
  const maple = c => `<svg viewBox="0 0 40 40" width="100%" height="100%"><path fill="${c}" d="M20 2 L23 12 L31 8 L28 17 L38 18 L30 24 L33 32 L23 28 L21 38 L19 38 L17 28 L7 32 L10 24 L2 18 L12 17 L9 8 L17 12Z"/></svg>`;
  const colors = ['#e0a526', '#f0b93a', '#d48a1c', '#b8432b', '#c9572f'];

  function spawn(delay = 0) {
    const el = document.createElement('div');
    el.className = 'leaf';
    const c = colors[Math.floor(Math.random() * colors.length)];
    const size = 16 + Math.random() * 18;
    el.innerHTML = Math.random() < .65 ? ginkgo(c) : maple(c);
    el.style.width = el.style.height = size + 'px';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    el.style.setProperty('--spin', (Math.random() * 720 - 360) + 'deg');
    const dur = 8 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = delay + 's';
    box.appendChild(el);
    setTimeout(() => el.remove(), (dur + delay) * 1000);
  }
  function burst(n) { if (!reduce) for (let i = 0; i < n; i++) spawn(Math.random() * 1.5); }

  if (!reduce) {
    for (let i = 0; i < 10; i++) spawn(Math.random() * 6);
    setInterval(() => spawn(), 900);
  }
</script>
</body>
</html>
